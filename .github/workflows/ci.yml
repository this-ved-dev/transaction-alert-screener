name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  UV_VERSION: "0.5.11"
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --all-extras --frozen
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m "not integration" --cov=screener --cov=rules --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with: { name: coverage, path: coverage.xml }

  integration:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: screener, POSTGRES_PASSWORD: ci, POSTGRES_DB: screener }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U screener" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://screener:ci@localhost:5432/screener
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --all-extras --frozen
      # Until TRA-34/TRA-35 land there are no integration tests; pytest exit code 5 (no tests) is accepted.
      - run: uv run pytest -m integration || [ $? -eq 5 ]

  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --all-extras --frozen
      - id: ready
        run: echo "ok=$([ -f screener/cli.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: "Contract and schema checks (always)"
        run: uv run pytest tests/test_contracts.py -q
      - name: Fixture run and rule regression (once TRA-6 and TRA-21 exist)
        if: steps.ready.outputs.ok == 'true'
        run: |
          uv run screener fixtures
          uv run screener run --day 2023-07-14 --store sqlite
          uv run pytest rules -q
      - if: steps.ready.outputs.ok != 'true'
        run: echo "::notice::rule regression skipped until screener/cli.py exists (TRA-6, TRA-21)"

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: false
          load: true
          tags: transaction-alert-screener:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Image smoke (always): the image imports the package"
        run: docker run --rm transaction-alert-screener:ci python -c "import screener, app; print('image ok')"
      - id: ready
        run: echo "ok=$([ -f app/manage.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Compose smoke (once the Django app exists, TRA-34)
        if: steps.ready.outputs.ok == 'true'
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait
          curl --retry 12 --retry-delay 5 --retry-connrefused -fsS http://localhost:8000/healthz
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm app screener fixtures
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm app screener load --source fixtures
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm app screener run --day 2023-07-14
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm app python app/manage.py assert_alerts --min 1
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: transaction-alert-screener:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - run: uv run pip-audit --strict || true   # advisory until the dependency set settles (TRA-10 makes it blocking)
        shell: bash
