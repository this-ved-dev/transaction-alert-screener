# Example rule folder. Copy this directory to rules/rNN_<slug>/ and edit. See docs/05-architecture.md § Day-0 contracts.
id: r00
name: Example cash-in total above a threshold
owner: example
version: 2
mode: "off"                    # live | shadow | off
key: customer                  # aggregation key the hit is reported on
windows:
  lookback_days: 1
params:
  threshold_usd: 10000.00      # every param key must be referenced in rule.sql as {{ params.<key> }}
weight: 1.0
red_flag_ids: [RF-004]
budget_per_month: 10
tier_multipliers: { low: 1.0, medium: 1.0, high: 1.0 }   # client thresholds are flat; change in the admin console
client_definition: "example only: cash in above the threshold on one day"
description: >
  Example only. Sums cash-in entries per customer per business day and fires when the total
  exceeds the threshold. Demonstrates the hit contract (group_key = cif_id for a customer-keyed rule) and parameter templating.
