# CI overrides: no TLS proxy, app on localhost:8000, deterministic LLM stub, throwaway volumes.
services:
  app:
    ports: ["8000:8000"]
    env_file: []
    environment:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      LLM_PROVIDER: stub
      SEED_DEMO_USERS: "true"
      POSTGRES_APP_PASSWORD: ci
  scheduler:
    profiles: ["disabled"]
  caddy:
    profiles: ["disabled"]
  db:
    environment:
      POSTGRES_PASSWORD: ci
      POSTGRES_APP_PASSWORD: ci
    tmpfs: ["/var/lib/postgresql/data"]
