[project]
name = "transaction-alert-screener"
version = "0.0.1"
description = "AML transaction alert screener for a regional bank: deterministic rules, audit trail, human decision, thin investigator agent."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "polars>=1.10",
  "pyarrow>=17",
  "pandas>=2.2",
  "pyyaml>=6",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "django>=5.1,<7",
  "django-htmx>=1.19",
  "django-simple-history>=3.7",
  "psycopg[binary]>=3.2",
  "gunicorn>=23",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=4",
  "pip-audit>=2.7",
]

[project.scripts]
screener = "screener.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screener", "app"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "reports", "research_notes", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]  # asserts are fine in tests and self-checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"rules/**/test_rule.py" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests", "rules"]
python_files = ["test_*.py"]
markers = [
  "integration: needs the Postgres service (deselected in the unit job)",
]
addopts = "-ra"
